<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="admin-container">
        <h3>Admin Approval Queue</h3>
        <div id="admin-activities-list">
          <p>Loading admin queue...</p>
        </div>

        <form id="new-activity-form" class="admin-form">
          <h4>Submit a new activity for review</h4>
          <div class="form-group">
            <label for="new-activity-name">Activity Name:</label>
            <input id="new-activity-name" type="text" required />
          </div>
          <div class="form-group">
            <label for="new-activity-description">Description:</label>
            <textarea id="new-activity-description" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="new-activity-schedule">Schedule:</label>
            <input id="new-activity-schedule" type="text" required />
          </div>
          <div class="form-group">
            <label for="new-activity-capacity">Max Participants:</label>
            <input id="new-activity-capacity" type="number" min="1" value="10" required />
          </div>
          <button type="submit">Submit for Approval</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
